<title>Taskas · Almacén de bebida</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f2f0f6;color:#1a1d21;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%;touch-action:manipulation}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;padding:0}
h2{margin:0 0 14px;font-size:24px}
.top{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:#1f2933;background-image:linear-gradient(100deg,rgba(255,255,255,.08),rgba(0,0,0,.18));box-shadow:0 2px 10px rgba(0,0,0,.18);color:#fff;display:flex;align-items:center;padding:10px 16px;min-height:66px}
.top>*+*{margin-left:12px}
.top h1{font-size:21px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:18px;padding:12px 18px;background:rgba(255,255,255,.18);border-radius:12px;color:#fff;font-weight:700}
.sync{font-size:13px;white-space:nowrap;background:rgba(0,0,0,.2);padding:6px 10px;border-radius:999px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.wrap{padding:16px;max-width:1200px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:16px}
.tile{border-radius:22px;color:#fff;padding:24px;text-align:left;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .ic{font-size:44px;line-height:1}
.tile b{font-size:30px;letter-spacing:.5px}
.tile span.s{font-size:16px;opacity:.92}
.tile.wide{grid-column:1 / span 2;min-height:120px;flex-direction:row;align-items:center;justify-content:flex-start}
.tile.wide .ic{font-size:54px;margin-right:22px}
.t-sal,.t-car{background:#e8590c;background-image:linear-gradient(135deg,#ff922b 0%,#e8590c 55%,#c2410c 100%)}.t-dev{background:#1971c2;background-image:linear-gradient(135deg,#4dabf7 0%,#1971c2 55%,#1450a0 100%)}.t-tra{background:#5f3dc4;background-image:linear-gradient(135deg,#9775fa 0%,#5f3dc4 55%,#4527a0 100%)}.t-ent{background:#2b8a3e}.t-rec{background:#7048e8}
.tile{position:relative;overflow:hidden}
.tile:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero{background:#0b0b0f;background-image:linear-gradient(120deg,#0b0b0f 0%,#1d0b18 55%,#6b0b45 100%);color:#fff;padding:18px 20px 70px;position:relative;display:flex;align-items:center}
.hero img{width:96px;height:96px;margin-right:18px;flex:0 0 96px;filter:drop-shadow(0 4px 12px rgba(194,12,122,.45))}
.hero .brand{font-size:13px;letter-spacing:4px;font-weight:800;color:#ff4fae}
.hero h1{margin:4px 0 0;font-size:32px;font-weight:800;letter-spacing:.3px}
.hero .sub{opacity:.75;font-size:15px;margin-top:4px}
.hero .sync{position:absolute;right:16px;top:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:12px;margin:-56px 0 16px;position:relative}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(30,20,50,.12);text-align:left;width:100%}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.stat span{font-size:14px;color:#616e7c;font-weight:600}
.btn2{box-shadow:0 2px 0 #ded8e8}
.row3{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:16px;margin-top:16px}
.btn2{display:block;background:#fff;border-radius:18px;padding:20px;font-size:19px;font-weight:700;box-shadow:0 2px 0 #d5dbe1;text-align:center}
.btn2:active{background:#f1f3f5}
.full{width:100%;margin-top:12px}
.alert{background:#fff4e6;border:2px solid #ffa94d;color:#a3410b;border-radius:16px;padding:14px 18px;margin-bottom:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.open{background:#e3fafc;border:2px solid #3bc9db;border-radius:18px;padding:14px;margin-bottom:16px}
.open h3{margin:0 0 10px;color:#0b7285;font-size:18px}
.oc{display:flex;align-items:center;width:100%;text-align:left;background:#fff;border-radius:14px;padding:14px 16px;margin-top:8px;box-shadow:0 1px 0 #c5f6fa}
.oc .grow{flex:1}
.prog{height:12px;background:#dee2e6;border-radius:6px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:#0c8599;border-radius:6px}
.sec{margin-top:22px}
.sec h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:#616e7c}
.li{display:flex;align-items:center;width:100%;text-align:left;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 0 #d5dbe1}
.li .grow{flex:1;min-width:0}
.li .ico{font-size:26px;margin-right:14px;width:34px;text-align:center}
.meta{font-size:14px;color:#616e7c;margin-top:2px}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:#e9ecef;color:#495057;white-space:nowrap;margin-left:8px}
.tag.g{background:#d3f9d8;color:#2b8a3e}.tag.y{background:#fff3bf;color:#e67700}.tag.r{background:#ffe3e3;color:#c92a2a}
.empty{background:#fff;border-radius:20px;padding:30px;text-align:center;margin-bottom:16px}
.empty h2{margin-bottom:6px}
.in{width:100%;font-size:19px;padding:14px;border-radius:12px;border:2px solid #ced4da;background:#fff;-webkit-appearance:none;font-family:inherit}
.in:focus{outline:none;border-color:#495057}
.search{margin-bottom:10px}
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 12px}
.tab{flex:0 0 auto;padding:12px 18px;border-radius:999px;background:#fff;font-weight:700;border:2px solid #dee2e6;margin-right:8px;white-space:nowrap}
.tab.on{background:#1f2933;color:#fff;border-color:#1f2933}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-gap:12px;padding-bottom:120px}
.card{background:#fff;border-radius:18px;padding:14px;border:3px solid transparent;box-shadow:0 1px 0 #d5dbe1}
.card.sel{border-color:var(--c)}
.ch{display:flex;justify-content:space-between;align-items:flex-start}
.ch h3{margin:0;font-size:19px}
.stk{text-align:right;font-weight:800;font-size:17px;white-space:nowrap;margin-left:10px}
.stk small{display:block;font-size:12px;font-weight:600;color:#868e96}
.stk.low{color:#c92a2a}
.step{display:flex;align-items:center;margin-top:10px}
.step label{flex:1;font-size:15px;color:#3e4c59;font-weight:600}
.pm{width:58px;height:58px;border-radius:14px;background:#e9ecef;font-size:32px;font-weight:700;line-height:58px}
.pm.plus{background:var(--c);color:#fff}
.num{min-width:76px;height:58px;border-radius:14px;border:2px solid #ced4da;font-size:25px;font-weight:800;background:#fff;margin:0 8px}
.res{margin-top:10px;font-size:15px;background:#f8f9fa;border-radius:10px;padding:8px 10px}
.took{margin-top:8px;font-size:15px;background:#e7f5ff;color:#1864ab;border-radius:10px;padding:8px 10px}
.neg{color:#c92a2a;font-weight:700}.pos{color:#2b8a3e;font-weight:700}.ok{color:#2b8a3e;font-weight:700}
.segw{display:flex;align-items:center;flex-wrap:wrap;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:12px}
.segw span{font-weight:700;margin-right:12px;color:#3e4c59}
.seg{padding:14px 20px;border-radius:12px;font-weight:800;font-size:18px;background:#f1f3f5;margin:4px 8px 4px 0}
.seg.on{background:var(--c);color:#fff}
.mini{font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;background:#fff;border:2px solid #ced4da;margin-left:8px}
.linkbox,.hint{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:16px}
.none{padding:30px;text-align:center;color:#868e96;grid-column:1/-1}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dee2e6;padding:12px 16px;display:flex;align-items:center;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.07)}
.bar>*+*{margin-left:12px}
.bsum{flex:1;font-size:18px}
.big{background:var(--c,#1f2933);color:#fff;font-size:21px;font-weight:800;padding:18px 28px;border-radius:16px}
.big[disabled]{opacity:.35}
.ghost{font-weight:700;padding:14px 18px;border-radius:14px;background:#f1f3f5}
.lg{font-size:19px;padding:18px 22px}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,20,25,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:#fff;border-radius:22px;width:100%;max-width:680px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px}
.sheet.small{max-width:460px}
.numpad{max-width:400px}
.pt{font-size:18px;font-weight:700;text-align:center}
.disp{font-size:50px;font-weight:800;text-align:center;padding:8px;border-radius:14px;background:#f1f3f5;margin:10px 0 14px;min-height:78px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:10px}
.keys button{height:74px;border-radius:16px;background:#f1f3f5;font-size:30px;font-weight:700}
.keys button:active{background:#dee2e6}
.pbtn{display:flex;margin-top:16px}
.pbtn>*{flex:1}
.pbtn>*+*{margin-left:10px}
.lb{display:block;font-weight:700;margin:16px 0 6px;font-size:15px;color:#3e4c59}
.chip{display:inline-block;padding:12px 18px;border-radius:999px;border:2px solid #ced4da;background:#fff;font-weight:700;margin:0 8px 8px 0}
.chip.on{background:var(--c,#1f2933);color:#fff;border-color:transparent}
.chip.sm{padding:8px 14px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}
th{font-size:13px;color:#868e96;text-transform:uppercase}
td.r,th.r{text-align:right}
.askm{font-size:20px;line-height:1.4;margin:4px 0 6px}
.srow{display:flex;align-items:center;width:100%;text-align:left;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;border-left:8px solid #51cf66}
.sv3{display:flex;text-align:right}
.sv3>div{min-width:118px;font-size:17px;font-weight:700;margin-left:10px}
.sv3 small{display:block;font-size:12px;color:#868e96;font-weight:700}
.sv3 .t{font-size:20px;font-weight:800}
@media (max-width:800px){.sv3>div{min-width:86px;font-size:15px}.sv3 .t{font-size:17px}}
.badge{display:inline-block;color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;vertical-align:3px;margin-left:6px}
.srow.st-ok{border-left-color:#40c057}.srow.st-poco{border-left-color:#fd7e14;background:#fff9f2}.srow.st-no{border-left-color:#fa5252;background:#fff5f5}
.srow.zero{border-left-color:#ced4da;opacity:.6}
.srow.low{border-left-color:#fa5252;background:#fff5f5}
.srow .grow{flex:1}
.sv{text-align:right;font-size:20px;font-weight:800}
.sv small{display:block;font-size:13px;color:#868e96;font-weight:600}
.chk{display:flex;align-items:center;width:100%;text-align:left;background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;border:3px solid #dee2e6;min-height:78px}
.chk .box{width:48px;height:48px;border-radius:12px;border:3px solid #adb5bd;margin-right:16px;flex:0 0 48px;font-size:32px;line-height:42px;text-align:center;color:#fff;font-weight:900}
.chk .grow{flex:1}
.chk .q{font-size:20px;font-weight:800;margin-left:10px;white-space:nowrap}
.chk.on{border-color:#2b8a3e;background:#ebfbee}
.chk.on .box{background:#2b8a3e;border-color:#2b8a3e}
.chk.on b{text-decoration:line-through;color:#495057}
.bigprog{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.bigprog .n{font-size:28px;font-weight:800}
.bigprog .prog{height:18px;border-radius:9px}
.mrow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f1f3f5}
.mrow .grow{flex:1;font-weight:600}
.mrow .pm{width:46px;height:46px;line-height:46px;font-size:26px}
.mrow .num{min-width:60px;height:46px;font-size:20px}
.mrow.off .grow{color:#adb5bd;text-decoration:line-through}
.panel{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 10px}
.hr{display:flex}
.hr>*+*{margin-left:10px}
#toast{position:fixed;left:50%;bottom:110px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#1f2933;color:#fff;padding:16px 24px;border-radius:14px;font-size:18px;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
#toast.bad{background:#c92a2a}
@media (max-width:700px){.tiles{grid-template-columns:1fr}.tile.wide{grid-column:auto}.row3{grid-template-columns:1fr}}
</style>

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function plain(o){return JSON.parse(JSON.stringify(o))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function catIdx(c){var i=S.cfg.cats.indexOf(c);return i<0?999:i}
function prodList(){return Object.keys(S.prods).map(function(k){return S.prods[k]}).filter(function(p){return p&&p.activo!==false}).sort(function(a,b){return catIdx(a.cat)-catIdx(b.cat)||String(a.nombre).localeCompare(String(b.nombre),'es')})}
function pc(p){return Math.max(1,parseInt(p&&p.porCaja,10)||1)}
function udn(p){return (p&&p.ud)||'ud'}
function pl(w,x){if(x===1||w==='ud')return w;if(/ín$/.test(w))return w.replace(/ín$/,'ines');if(/[aeiouáéó]$/.test(w))return w+'s';return w+'es'}
function r2(x){return Math.round((+x||0)*100)/100}
function nf(x){return String(r2(x)).replace('.',',')}
function pnum(v){return r2(parseFloat(String(v||'0').replace(',','.'))||0)}
function fmt(u,p){u=r2(u);var n=pc(p),neg=u<0,a=Math.abs(u);if(n<=1)return (neg?'−':'')+nf(a)+' '+pl(udn(p),a);var c=Math.floor(a/n+1e-9),r=r2(a-c*n),s='';if(c)s+=c+' cj';if(c&&r)s+=' + ';if(r)s+=nf(r)+' '+pl(udn(p),r);if(!c&&!r)s='0';return (neg?'−':'')+s}

var SUK=null,SUM={};

/* ---------- guardado: local + nube con cola persistente ---------- */
function saveLocal(){lsSet(LS,{prods:S.prods,ops:S.ops.slice(0,800),cfg:S.cfg})}
var flushing=false, retryT=null;
function push(k,path,data){
  for(var i=outbox.length-1;i>=(flushing?1:0);i--){if(outbox[i].p===path)outbox.splice(i,1)}
  outbox.push({k:k,p:path,d:data});lsSet(OB,outbox);flush();
}
function flush(){
  if(mode!=='db'||flushing||!outbox.length){setSync();return}
  flushing=true;setSync();
  var w=outbox[0],pr;
  try{var ref=db.doc(w.p);pr=w.k==='delete'?ref.delete():ref.set(w.d)}catch(e){pr=Promise.reject({code:'invalid_argument'})}
  pr.then(function(){outbox.shift();lsSet(OB,outbox);flushing=false;flush()},function(e){
    flushing=false;var c=e&&e.code;
    if(c==='invalid_argument'||c==='transform_error'){outbox.shift();lsSet(OB,outbox);toast('Un cambio no se pudo guardar en la nube',true);flush();return}
    if(c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){mode='local';render();return}
    if(c==='quota_exceeded')toast('La base de datos está llena: borra historial antiguo en Ajustes',true);
    clearTimeout(retryT);retryT=setTimeout(flush,15000);setSync();
  });
}
function overlay(){
  outbox.forEach(function(w){var s=w.p.split('/'),col=s[0],id=s[1];
    if(col==='productos'){if(w.k==='delete')delete S.prods[id];else S.prods[id]=plain(w.d)}
    else if(col==='ops'){S.ops=S.ops.filter(function(o){return o.id!==id});if(w.k!=='delete')S.ops.push(plain(w.d))}
    else if(col==='config'&&w.k!=='delete'){S.cfg=plain(w.d)}
  });
  S.ops.sort(function(a,b){return b.ts-a.ts});
}
function putProd(p){S.prods[p.id]=p;push('set','productos/'+p.id,plain(p));saveLocal()}
function putOp(op){S.ops=S.ops.filter(function(o){return o.id!==op.id});S.ops.unshift(op);S.ops.sort(function(a,b){return b.ts-a.ts});push('set','ops/'+op.id,plain(op));saveLocal()}
function delOp(id){S.ops=S.ops.filter(function(o){return o.id!==id});push('delete','ops/'+id,null);saveLocal()}
function putCfg(){push('set','config/general',plain(S.cfg));saveLocal()}
function setStock(pid,v,l){var p=S.prods[pid];if(!p)return;if(l==='C')p.stockC=r2(v);else p.stock=r2(v);putProd(p)}
function getOp(id){for(var i=0;i<S.ops.length;i++)if(S.ops[i].id===id)return S.ops[i];return null}

function applyOp(op){
  op.lineas.forEach(function(l){var p=S.prods[l.pid];if(!p)return;
    if(op.tipo==='recuento'){var lc=opLoc(op),cur=stk(p,lc);l.antes=cur;l.dif=r2(l.contado-cur);setStock(l.pid,l.contado,lc);return}
    var d=opDe(op),a=opA(op);if(d)setStock(l.pid,stk(p,d)-l.cant,d);if(a)setStock(l.pid,stk(p,a)+l.cant,a)});
  putOp(op);autoBackup(false);
}
function anular(op){
  op.lineas.forEach(function(l){var p=S.prods[l.pid];if(!p)return;
    if(op.tipo==='recuento'){var lc=opLoc(op);setStock(l.pid,stk(p,lc)-(l.dif||0),lc);return}
    var d=opDe(op),a=opA(op);if(d)setStock(l.pid,stk(p,d)+l.cant,d);if(a)setStock(l.pid,stk(p,a)-l.cant,a)});
  delOp(op.id);
}

function goLocal(){mode='local';var u=lsGet(LSU)||{};if(!prodList().length&&!S.ops.length&&!u.seeded){u.seeded=1;lsSet(LSU,u);seed()}u=lsGet(LSU)||{};if(!u.sv26&&prodList().length){u.sv26=1;lsSet(LSU,u);aplicarSuelo(false)}render()}
function init(){
  var c=lsGet(LS);if(c){S.prods=c.prods||{};S.ops=c.ops||[];if(c.cfg)S.cfg=Object.assign(S.cfg,c.cfg)}
  overlay();
  var u=lsGet(LSU);if(u&&u.who)UI.who=u.who;
  render();
  var done=false,t=setTimeout(function(){if(!done)goLocal()},10000);
  if(!window.claude||typeof window.claude.use!=='function'){clearTimeout(t);goLocal();return}
  window.claude.use('downloads').then(function(d){dl=d},function(){});
  window.claude.use('db').then(function(d){done=true;clearTimeout(t);if(!d){goLocal();return}db=d;mode='db';render();subscribe();flush()},function(){done=true;clearTimeout(t);mode='local';render()});
}
function subscribe(){
  var got={p:0,o:0,c:0};stale=false;
  var st=setTimeout(function(){stale=true;setSync()},10000);
  function ok(k,m){if(m&&!m.fromCache){got[k]=1;if(got.p&&got.o&&got.c){clearTimeout(st);stale=false}}}
  function err(e){clearTimeout(st);if(e&&e.code==='revoked'){mode='local'}else stale=true;render()}
  db.collection('productos').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=plain(d.data())});S.prods=m;overlay();saveLocal();ok('p',s.metadata);render()},err);
  db.collection('ops').orderBy('ts','desc').limit(500).onSnapshot(function(s){S.ops=s.docs.map(function(d){return plain(d.data())});overlay();saveLocal();ok('o',s.metadata);render()},err);
  db.doc('config/general').onSnapshot(function(d){if(d.exists)S.cfg=Object.assign({trab:[],pin:'1234',cats:DEF_CATS.slice(),plant:null},plain(d.data()));overlay();saveLocal();ok('c',d.metadata);render()},err);
}

function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

function autoBackup(force){
  var day=today(),u=lsGet(LSU)||{};if(!force&&u.bk===day)return;u.bk=day;lsSet(LSU,u);
  var loc=(lsGet(LSB)||[]).filter(function(b){return b.day!==day});loc.unshift({day:day,s:snapshot(null)});
  while(loc.length>7)loc.pop();lsSet(LSB,loc);
  var snap=snapshot(S.ops.slice(0,80)),js=JSON.stringify(snap);
  while(js.length>200000&&snap.ops.length){snap.ops=snap.ops.slice(0,Math.floor(snap.ops.length/2));js=JSON.stringify(snap)}
  push('set','copias/'+day,snap);
  if(mode==='db'){try{db.collection('copias').get().then(function(q){var ids=q.docs.map(function(d){return d.id}).sort().reverse();ids.slice(30).forEach(function(id){push('delete','copias/'+id,null)})},function(){})}catch(e){}}
}
function restoreSnap(j,label,withOps){
  var lines=[];
  Object.keys(j.prods||{}).forEach(function(k){var sp=j.prods[k];if(!sp)return;var cur=S.prods[k],np=plain(sp);np.stock=cur?(cur.stock||0):0;putProd(np);var tg=r2(sp.stock||0);if(tg!==r2(np.stock))lines.push({pid:k,nombre:np.nombre,n:pc(np),ud:udn(np),contado:tg})});
  if(j.cfg){S.cfg=Object.assign(S.cfg,plain(j.cfg));putCfg()}
  if(withOps)(j.ops||[]).forEach(function(o){if(o&&o.id&&!getOp(o.id))putOp(o)});
  if(lines.length)applyOp({id:uid(),ts:Date.now(),tipo:'recuento',ref:label,quien:UI.who||'',nota:'Stock restaurado desde copia de seguridad',lineas:lines});
  closeModal();render();toast('✔ Copia restaurada'+(lines.length?' ('+lines.length+' stocks corregidos)':''));
}
function saveFile(name,data,what){
  if(!dl){try{var bl=new Blob([data],{type:/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},1500);toast('✔ '+what+' descargado')}catch(e){copyText(data,what)}return}
  dl.save({filename:name,data:data}).then(function(){toast('✔ '+what+' descargado')},function(e){if(e&&e.code==='declined')return;copyText(data,what)});
}

  cadd:function(){openModal('<div class="ov" data-a="close"><div class="sheet small" data-a="noop"><h2>Añadir material</h2><input id="cam" class="in" placeholder="Ej: Mesa plegable"><label class="lb">Cantidad</label><input id="caq" class="in" type="number" inputmode="numeric" value="1"><div class="pbtn"><button class="ghost lg" data-a="close">Cancelar</button><button class="big" style="--c:#0c8599" data-a="caddok">Añadir</button></div></div></div>')},
  caddok:function(){var n=$('#cam').value.trim(),q=parseInt($('#caq').value,10)||1;if(!n)return;var o=getOp(UI.carga);if(!o)return;o.material=o.material||[];o.material.push({id:uid(),nombre:n,cant:q,chk:false});putOp(o);closeModal();render()},
  cclose:function(){var o=getOp(UI.carga);if(!o)return;var g=cargaProg(o);var go=function(){closeCarga(o)};
    if(g.d<g.t)ask('Faltan <b>'+(g.t-g.d)+'</b> cosas sin marcar.<br>¿Terminar la carga igualmente?','Terminar igualmente',go,true);
    else go()},
  cdel:function(){var o=getOp(UI.carga);if(!o)return;withPin('PIN para anular la carga',function(){ask('¿Anular la carga «'+esc(o.ref)+'»? La bebida vuelve al stock.','Anular',function(){anular(o);UI.view='home';render()},true)})},
  sc:function(t,d){UI.sc=d.c;UI.sq='';render()},
  pdet:function(t,d){prodDetail(d.p)},
  ht:function(t,d){UI.ht=d.c;render()},
  hop:function(t,d){UI.open=UI.open===d.id?null:d.id;if(UI.view!=='hist'){UI.view='hist';UI.ht='todos'}render()},
  anu:function(t,d){var o=getOp(d.id);if(!o)return;withPin('PIN para anular',function(){ask('¿Anular «'+esc(o.ref||MODES[o.tipo].t)+'» del '+fdate(o.ts)+'? El stock volverá a como estaba.','Anular',function(){anular(o);UI.open=null;render();toast('Movimiento anulado')},true)})},
  pedit:function(t,d){prodEditor(d.p||null)},
  psave:function(t,d){var n=$('#pn').value.trim();if(!n){toast('Pon un nombre',true);return}
    var p=d.p?S.prods[d.p]:{id:uid(),stock:0,activo:true};
    p.nombre=n;p.cat=$('#pcat').value;p.formato=$('#pf').value.trim();p.porCaja=Math.max(1,parseInt($('#ppc').value,10)||1);p.ud=$('#pud').value.trim()||'ud';p.min=Math.max(0,parseInt($('#pmin').value,10)||0);
    var st=!d.p&&$('#pst')?parseInt($('#pst').value,10)||0:0;putProd(p);
    if(st>0)applyOp({id:uid(),ts:Date.now(),tipo:'recuento',ref:'Stock inicial',quien:'',nota:'',lineas:[{pid:p.id,nombre:p.nombre,n:pc(p),ud:udn(p),contado:st}]});
    closeModal();render();toast('✔ Guardado')},
  pdel:function(t,d){var p=S.prods[d.p];ask('¿Eliminar «'+esc(p.nombre)+'»? El historial se conserva.','Eliminar',function(){p.activo=false;putProd(p);render()},true)},
  tadd:function(){var v=$('#tnew').value.trim();if(!v)return;S.cfg.trab.push(v);putCfg();render()},
  tdel:function(t,d){S.cfg.trab.splice(+d.i,1);putCfg();render()},
  cadc:function(){var v=$('#cnew').value.trim();if(!v||S.cfg.cats.indexOf(v)>=0)return;S.cfg.cats.push(v);putCfg();render()},
  cdelc:function(t,d){var c=S.cfg.cats[+d.i];if(prodList().some(function(p){return p.cat===c})){toast('Hay productos en esa categoría',true);return}S.cfg.cats.splice(+d.i,1);putCfg();render()},
  tminc:function(t,d){plantList()[d.pi].items[d.i].cant++;putCfg();render()},
  tmdec:function(t,d){var m=plantList()[d.pi].items[d.i];if(m.cant>0){m.cant--;putCfg();render()}},
  tmpad:function(t,d){var m=plantList()[d.pi].items[d.i];openPad({title:m.nombre,init:m.cant,cb:function(v){m.cant=parseInt(v||'0',10)||0;putCfg();render()}})},
  tmdel:function(t,d){plantList()[d.pi].items.splice(+d.i,1);putCfg();render()},
  tmadd:function(t,d){var i=$('#tmnew'+d.pi),v=i.value.trim();if(!v)return;plantList()[d.pi].items.push({id:uid(),nombre:v,cant:1});i.blur();putCfg();render()},
  plnew:function(){textAsk('Nombre de la nueva lista','Ej: Barra simple, Vermú…','',function(v){plantList().push({id:uid(),nombre:v,items:[]});putCfg();render()})},
  plren:function(t,d){var pl=plantList()[d.pi];textAsk('Renombrar lista','',pl.nombre,function(v){pl.nombre=v;putCfg();render()})},
  pldel:function(t,d){var pl=plantList()[d.pi];ask('¿Borrar la lista «'+esc(pl.nombre)+'»?','Borrar',function(){plantList().splice(+d.pi,1);putCfg();render()},true)},
  taok:function(){var v=$('#tai').value.trim();if(!v)return;var c=ASKCB;ASKCB=null;closeModal();c(v)},
  plant:function(t,d){loadPlant(+d.i);reviewKeep()},
  devde:function(t,d){var o=getOp(d.id);if(!o)return;closeModal();startMode('devolucion',o)},
  seed:function(){ask('¿Cargar tus productos con el stock de tu Excel?','Cargar',seed)},
  sv26:function(){ask('¿Poner en cada bebida lo que suelo llevar según la media de gasto por evento del verano 2026 (35 eventos)? Sustituye lo que hubiera puesto a mano.','Poner medias',function(){var n=aplicarSuelo(true);render();toast('✔ Medias puestas en '+n+' productos')})},
  xls:function(){ask('¿Poner el stock que había en tu Excel (hoja STOCK 2026)? Se apunta como un recuento y se puede anular.','Poner stock',function(){var n=excelStock();render();toast(n?'✔ Stock del Excel cargado ('+n+' productos)':'El stock ya coincide con el Excel')})},
  csv:function(){var r=['Producto;Categoría;Formato;Uds por caja;Nave (uds);Camión (uds);Total (uds);Suelo llevar (uds);Estado'];prodList().forEach(function(p){r.push([p.nombre,p.cat,p.formato||'',pc(p),nf(stk(p,'N')),nf(stk(p,'C')),nf(totS(p)),nf(suelo(p)),EST[estado(p)][1]].join(';'))});saveFile('stock-'+today()+'.csv','\ufeff'+r.join('\r\n'),'Stock')},
  bk:function(){saveFile('copia-almacen-'+today()+'.json',JSON.stringify(snapshot(S.ops)),'Copia de seguridad')},
  bknow:function(){autoBackup(true);render();toast('✔ Copia de hoy guardada')},
  bklist:function(){
    var loc=(lsGet(LSB)||[]).map(function(b){return {day:b.day,s:b.s,src:'ipad'}});
    BKS=loc;bkListModal();
    if(mode==='db'){try{db.collection('copias').get().then(function(q){var m={};loc.forEach(function(b){m[b.day]=b});q.docs.forEach(function(d){m[d.id]={day:d.id,s:plain(d.data()),src:'nube'}});BKS=Object.keys(m).sort().reverse().map(function(k){return m[k]});if($('#modal').innerHTML.indexOf('Copias automáticas')>=0)bkListModal()},function(){})}catch(e){}}},
  bkres:function(t,d){var b=BKS[+d.i];if(!b)return;withPin('PIN para restaurar',function(){ask('¿Restaurar la copia del <b>'+b.day.split('-').reverse().join('/')+'</b>? El stock volverá a como estaba ese día.','Restaurar',function(){restoreSnap(b.s,'Restaurar copia '+b.day.split('-').reverse().join('/'),false)},true)})},
  rest:function(){openModal('<div class="ov" data-a="close"><div class="sheet" data-a="noop"><h2>Restaurar desde archivo</h2><p class="meta">Elige el archivo .json que descargaste con «Descargar copia».</p><input type="file" id="bkfile" class="in" accept=".json,application/json,text/plain"><p class="meta" style="margin-top:14px">O pega aquí el texto de la copia:</p><textarea id="rtx" class="in" rows="8"></textarea><div class="pbtn"><button class="ghost lg" data-a="close">Cancelar</button><button class="big" data-a="restok">Restaurar</button></div></div></div>')},
  restok:function(){var j;try{j=JSON.parse($('#rtx').value)}catch(e){toast('El texto no es una copia válida',true);return}if(!j||j.app!=='stockNave'){toast('El texto no es una copia válida',true);return}
    var go=function(){restoreSnap(j,'Restaurar copia (archivo)',true)};withPin('PIN para restaurar',function(){ask('¿Restaurar esta copia? El stock volverá a como estaba en la copia.','Restaurar',go,true)})},
  pin:function(){openPad({title:'Nuevo PIN (4 a 8 cifras)',pin:true,cb:function(a){if(a.length<4){toast('Mínimo 4 cifras',true);return}openPad({title:'Repite el nuevo PIN',pin:true,cb:function(b){if(a!==b){toast('No coinciden',true);return}S.cfg.pin=a;putCfg();toast('✔ PIN cambiado')}})}})},
  purge:function(){var lim=Date.now()-365*864e5,old=S.ops.filter(function(o){return o.ts<lim&&o.estado!=='abierta'});if(!old.length){toast('No hay movimientos de más de un año');return}ask('¿Borrar '+old.length+' movimientos de hace más de un año? El stock no cambia.','Borrar',function(){old.forEach(function(o){delOp(o.id)});render()},true)}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t||t.disabled)return;var f=A[t.getAttribute('data-a')];if(f)f(t,t.dataset,e)});
document.addEventListener('change',function(e){if(e.target.id!=='bkfile'||!e.target.files||!e.target.files[0])return;var fr=new FileReader();fr.onload=function(){var x=$('#rtx');if(x){x.value=String(fr.result);A.restok()}};fr.readAsText(e.target.files[0])});
document.addEventListener('input',function(e){var id=e.target.id;
  if(id==='q'){UI.q=e.target.value;$('#grid').innerHTML=gridHtml();$('#tabs').innerHTML=tabsHtml()}
  else if(id==='sq'){UI.sq=e.target.value;$('#slist').innerHTML=stockListHtml()}
  else if(id==='ref')UI.ref=e.target.value;else if(id==='nota')UI.nota=e.target.value});
init();
})();
</script>
</body>
</html>
